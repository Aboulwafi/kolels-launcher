
name: Build Koleos Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation de Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Installation du SDK Android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Acceptation automatique des licences
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      # 5. Installation des composants Android
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Configuration de Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Création du projet Android
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/koleos/launcher

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KoleosLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.koleos.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.koleos.launcher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Koleos Launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/koleos/launcher/MainActivity.kt <<'EOF'
          package com.koleos.launcher

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      KoleosApp(
                          onSpotify = { openApp("com.spotify.music") },
                          onMaps = { openApp("com.google.android.apps.maps") },
                          onWaze = { openApp("com.waze") }
                      )
                  }
              }

              private fun openApp(packageName: String) {
                  val intent = packageManager.getLaunchIntentForPackage(packageName)
                      ?: Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$packageName"))

                  startActivity(intent)
              }
          }

          @Composable
          fun KoleosApp(
              onSpotify: () -> Unit,
              onMaps: () -> Unit,
              onWaze: () -> Unit
          ) {
              val background = Color(0xFF080B10)
              val gold = Color(0xFFC7A66A)
              val white = Color(0xFFF4F2ED)

              MaterialTheme {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(background)
                          .padding(24.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {

                      Spacer(modifier = Modifier.height(20.dp))

                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(
                              "RENAULT",
                              color = gold,
                              fontSize = 15.sp,
                              letterSpacing = 6.sp
                          )

                          Spacer(modifier = Modifier.height(8.dp))

                          Text(
                              "KOLEOS",
                              color = white,
                              fontSize = 38.sp,
                              fontWeight = FontWeight.Light,
                              letterSpacing = 8.sp
                          )

                          Text(
                              "II  •  TECHNO  •  2023",
                              color = gold,
                              fontSize = 11.sp,
                              letterSpacing = 3.sp
                          )
                      }

                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(
                              "◆",
                              color = gold,
                              fontSize = 100.sp
                          )

                          Text(
                              "YOUR JOURNEY STARTS HERE",
                              color = white,
                              fontSize = 11.sp,
                              letterSpacing = 2.sp,
                              textAlign = TextAlign.Center
                          )
                      }

                      Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          LauncherButton("SPOTIFY", onSpotify, gold)
                          LauncherButton("GOOGLE MAPS", onMaps, white)
                          LauncherButton("WAZE", onWaze, white)
                      }

                      Text(
                          "KOLEOS LAUNCHER  •  VERSION 1.0",
                          color = Color.Gray,
                          fontSize = 10.sp,
                          letterSpacing = 1.sp
                      )
                  }
              }
          }

          @Composable
          fun LauncherButton(
              label: String,
              onClick: () -> Unit,
              color: Color
          ) {
              Button(
                  onClick = onClick,
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(58.dp),
                  shape = RoundedCornerShape(12.dp),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = Color(0xFF202630),
                      contentColor = color
                  )
              ) {
                  Text(
                      label,
                      fontSize = 14.sp,
                      letterSpacing = 2.sp,
                      fontWeight = FontWeight.Medium
                  )
              }
          }
          EOF

      # 8. Compilation de l'application
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # 9. Vérification de l'APK
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 10. Publication de l'APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Koleos-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
