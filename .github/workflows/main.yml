
name: Build Koleos Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/koleos/launcher

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KoleosLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.koleos.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.koleos.launcher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.animation:animation")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <package android:name="com.spotify.music"/>
                  <package android:name="com.google.android.apps.maps"/>
                  <package android:name="com.waze"/>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Koleos Launcher"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/koleos/launcher/MainActivity.kt <<'EOF'
          package com.koleos.launcher

          import android.os.Bundle
          import android.content.Intent
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.*
          import kotlinx.coroutines.delay

          private val Blue = Color(0xFF55C7ED)
          private val Dark = Color(0xFF070B11)
          private val Panel = Color(0xFF14202D)

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor =
                      android.graphics.Color.rgb(7, 11, 17)

                  window.navigationBarColor =
                      android.graphics.Color.rgb(7, 11, 17)

                  setContent {
                      KoleosApp()
                  }
              }
          }

          @Composable
          fun KoleosApp() {
              var intro by remember { mutableStateOf(true) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Blue,
                      background = Dark,
                      surface = Panel
                  )
              ) {
                  Surface(
                      modifier = Modifier.fillMaxSize(),
                      color = Dark
                  ) {
                      AnimatedContent(
                          targetState = intro,
                          label = "launcher"
                      ) { opening ->
                          if (opening) {
                              IntroScreen {
                                  intro = false
                              }
                          } else {
                              HomeScreen()
                          }
                      }
                  }
              }
          }

          @Composable
          fun IntroScreen(onFinish: () -> Unit) {

              var progress by remember {
                  mutableFloatStateOf(0f)
              }

              LaunchedEffect(Unit) {
                  while (progress < 1f) {
                      progress = (progress + 0.012f)
                          .coerceAtMost(1f)
                      delay(16)
                  }
                  delay(500)
                  onFinish()
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(
                              listOf(
                                  Color.Black,
                                  Color(0xFF142638),
                                  Dark
                              )
                          )
                      ),
                  contentAlignment = Alignment.Center
              ) {

                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {

                      Text(
                          "RENAULT",
                          color = Color.LightGray,
                          fontSize = 13.sp,
                          letterSpacing = 8.sp
                      )

                      Spacer(Modifier.height(15.dp))

                      Text(
                          "◇",
                          color = Blue,
                          fontSize = 75.sp
                      )

                      Text(
                          "KOLEOS",
                          color = Color.White,
                          fontSize = 38.sp,
                          fontWeight = FontWeight.Light,
                          letterSpacing = 9.sp
                      )

                      Text(
                          "LAUNCHER 2023",
                          color = Blue,
                          fontSize = 11.sp,
                          letterSpacing = 5.sp
                      )

                      Spacer(Modifier.height(35.dp))

                      LinearProgressIndicator(
                          progress = { progress },
                          modifier = Modifier.width(160.dp),
                          color = Blue
                      )
                  }

                  TextButton(
                      onClick = onFinish,
                      modifier = Modifier
                          .align(Alignment.TopEnd)
                          .padding(15.dp)
                  ) {
                      Text("PASSER", color = Color.Gray)
                  }
              }
          }

          @Composable
          fun HomeScreen() {

              val context = androidx.compose.ui.platform.LocalContext.current

              var message by remember {
                  mutableStateOf("Votre espace de conduite")
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Dark)
                      .verticalScroll(rememberScrollState())
                      .padding(22.dp),
                  verticalArrangement = Arrangement.spacedBy(20.dp)
              ) {

                  Text(
                      "KOLEOS",
                      color = Color.White,
                      fontSize = 30.sp,
                      letterSpacing = 7.sp
                  )

                  Text(
                      "2023  •  TECHNO  •  BLACK",
                      color = Blue,
                      fontSize = 11.sp,
                      letterSpacing = 2.sp
                  )

                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(185.dp)
                          .background(
                              Brush.linearGradient(
                                  listOf(
                                      Color(0xFF24394D),
                                      Color(0xFF101720)
                                  )
                              ),
                              RoundedCornerShape(22.dp)
                          ),
                      contentAlignment = Alignment.Center
                  ) {
                      Column(
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              "◇",
                              color = Blue,
                              fontSize = 65.sp
                          )
                          Text(
                              "YOUR KOLEOS",
                              color = Color.White,
                              fontSize = 20.sp,
                              letterSpacing = 4.sp
                          )
                          Text(
                              "BLACK EDITION",
                              color = Blue,
                              fontSize = 11.sp,
                              letterSpacing = 3.sp
                          )
                      }
                  }

                  Text(message, color = Color.LightGray)

                  LauncherButton("MUSIC", "Spotify") {
                      message = openApp(
                          context,
                          "com.spotify.music",
                          "Spotify"
                      )
                  }

                  LauncherButton("NAVIGATION", "Google Maps") {
                      message = openApp(
                          context,
                          "com.google.android.apps.maps",
                          "Google Maps"
                      )
                  }

                  LauncherButton("WAZE", "Navigation") {
                      message = openApp(
                          context,
                          "com.waze",
                          "Waze"
                      )
                  }

                  Text(
                      "KOLEOS LAUNCHER • VERSION 1.0",
                      color = Color.Gray,
                      fontSize = 10.sp,
                      textAlign = TextAlign.Center,
                      modifier = Modifier.fillMaxWidth()
                  )
              }
          }

          @Composable
          fun LauncherButton(
              title: String,
              subtitle: String,
              onClick: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(
                          Panel,
                          RoundedCornerShape(18.dp)
                      )
                      .clickable { onClick() }
                      .padding(20.dp)
              ) {
                  Text(
                      title,
                      color = Blue,
                      fontWeight = FontWeight.Bold,
                      fontSize = 15.sp,
                      letterSpacing = 2.sp
                  )
                  Text(
                      subtitle,
                      color = Color.White,
                      fontSize = 12.sp
                  )
              }
          }

          fun openApp(
              context: android.content.Context,
              packageName: String,
              name: String
          ): String {
              val intent = context.packageManager
                  .getLaunchIntentForPackage(packageName)

              return if (intent != null) {
                  context.startActivity(intent)
                  "$name ouvert"
              } else {
                  "$name n'est pas installé"
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoleosLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
